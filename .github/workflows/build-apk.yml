# Builds a ready-to-install APK on GitHub (no Expo login, no QR code).
# Run it: GitHub repo → Actions → "Build APK" → Run workflow.
# Then open the finished run → Artifacts → "hrm-eovo-apk" → download → unzip → install the .apk.
name: Build APK
on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - name: Generate the Android project
        run: npx expo prebuild -p android --clean
        env:
          # Optional: GitHub repo → Settings → Variables → BACKEND_URL. If not set,
          # the app uses the apiUrl written in app.json.
          EXPO_PUBLIC_BACKEND_URL: ${{ vars.BACKEND_URL }}
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
        env:
          EXPO_PUBLIC_BACKEND_URL: ${{ vars.BACKEND_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: hrm-eovo-apk
          path: android/app/build/outputs/apk/release/*.apk
